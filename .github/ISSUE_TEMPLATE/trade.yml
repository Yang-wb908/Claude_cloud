name: 페이퍼 포지션 개시·종료
description: 판단을 가격으로 번역한 가상 포지션을 장부에 넣거나 닫습니다. 봇이 book.json을 갱신하고 일일 동기화가 시가평가합니다.
title: "[포지션] "
labels: ["trade"]
body:
  - type: dropdown
    id: action
    attributes:
      label: 동작
      options: ["개시", "종료"]
    validations:
      required: true
  - type: input
    id: tid
    attributes:
      label: 포지션 id
      description: 종료할 때만. 개시 시 비우면 자동 부여.
  - type: dropdown
    id: cm
    attributes:
      label: 상품
      options: ["brent", "wti", "products", "natgas", "ttf", "gold", "silver", "copper", "wheat", "corn", "soy", "rice", "sugar", "coffee", "cocoa", "cotton", "usd", "rates", "vix", "kospi", "btc", "bdi", "uranium", "lithium"]
  - type: dropdown
    id: side
    attributes:
      label: 방향
      options: ["long", "short"]
  - type: input
    id: entry
    attributes:
      label: 진입가 (비우면 첫 종가)
  - type: input
    id: size
    attributes:
      label: 사이즈 (기본 1)
  - type: input
    id: stop
    attributes:
      label: 손절가
  - type: input
    id: target
    attributes:
      label: 목표가
  - type: input
    id: scn
    attributes:
      label: 근거 시나리오 id (쉼표)
      placeholder: "hormuz_persist,hormuz_war"
  - type: textarea
    id: thesis
    attributes:
      label: 논지
    validations:
      required: true
  - type: input
    id: exit
    attributes:
      label: 종료가 (종료 시, 비우면 최근 종가)
