name: Issue 접수 (시나리오·판정·현장보고)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    if: ${{ contains(github.event.issue.labels.*.name, 'scenario') || contains(github.event.issue.labels.*.name, 'judgment') || contains(github.event.issue.labels.*.name, 'event') || contains(github.event.issue.labels.*.name, 'pir') || contains(github.event.issue.labels.*.name, 'handover') || contains(github.event.issue.labels.*.name, 'watchcon') || contains(github.event.issue.labels.*.name, 'dissent') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: 종류 판별
        id: kind
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          for k in scenario judgment event pir handover watchcon dissent; do
            case ",$LABELS," in *",$k,"*) echo "kind=$k" >> "$GITHUB_OUTPUT"; break;; esac
          done
      - name: 처리
        id: run
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -eo pipefail
          python dashboard/pipeline/intake.py "${{ steps.kind.outputs.kind }}" > /tmp/reply.md
          echo "---- reply ----"; cat /tmp/reply.md
      - name: 데이터 커밋
        if: ${{ steps.run.outputs.changed == 'true' }}
        run: |
          git config user.name "situation-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/judgments.json dashboard/data_snapshot.json dashboard/data/house_view.json dashboard/data/pirs.json dashboard/data/watch_log.json dashboard/data/watchcon.json dashboard/data/warnings_pending.json
          git diff --cached --quiet || (git commit -m "data: issue #${{ github.event.issue.number }} ${{ steps.kind.outputs.kind }} 반영 [skip ci]" && git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push)
      - name: 댓글
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n\n---\n_자동 처리 · %s · run %s_\n' "$(cat /tmp/reply.md)" "${{ steps.kind.outputs.kind }}" "${{ github.run_id }}" > /tmp/body.md
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/body.md
      - name: 판정·보고 이슈는 닫기
        if: ${{ steps.run.outputs.changed == 'true' && steps.kind.outputs.kind != 'scenario' && steps.kind.outputs.kind != 'pir' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --reason completed
