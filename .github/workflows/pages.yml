name: GitHub Pages 배포 (수집·동기화 후 상황판 빌드)

# 수집(6시간)·일일 동기화·부트스트랩이 끝날 때마다, 그리고 대시보드 소스가 푸시될 때마다 index.html 을 빌드해 Pages 에 올린다.
# Pages 가 꺼져 있으면 실패하지 않고 건너뛴다(Settings → Pages → Source: GitHub Actions 로 켜면 자동 배포). 주소: https://<owner>.github.io/<repo>/
on:
  workflow_run:
    workflows: ["상황판 수집 (6시간 주기)", "일일 동기화 (시세·예측 스냅숏·적중 채점)", "부트스트랩 실행 (작업 브랜치에서 전체 파이프라인 1회)"]
    types: [completed]
  push:
    branches: ["claude/compassionate-rubin-jmaq9e", "main"]
    paths: ["dashboard/*.js", "dashboard/app.html", "dashboard/build.py", "dashboard/*.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pages 켜짐 확인
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "on=1" >> "$GITHUB_OUTPUT"
          else
            echo "on=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages 꺼짐::GitHub Pages 가 꺼져 있어 배포를 건너뜁니다. Settings → Pages → Source 를 GitHub Actions 로 바꾸면 다음 수집부터 자동 배포됩니다."
            echo "GitHub Pages 가 꺼져 있어 배포를 건너뛰었습니다 (실패 아님). Settings → Pages → Source: GitHub Actions 로 켜면 자동 배포됩니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.on == '1'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        if: steps.pages.outputs.on == '1'
        with:
          python-version: "3.12"
      - run: pip install -r dashboard/pipeline/requirements.txt
        if: steps.pages.outputs.on == '1'
      - name: 상황판 빌드
        if: steps.pages.outputs.on == '1'
        run: |
          python dashboard/build.py
          mkdir -p site/products
          cp dashboard/index.html site/index.html
          [ -f dashboard/brief.html ] && cp dashboard/brief.html site/brief.html || true
          cp products/*.md site/products/ 2>/dev/null || true
          cp products/index.json site/products/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0; url=../index.html">' > site/products/index.html
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.on == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == '1'
        with:
          path: site
      - id: deploy
        if: steps.pages.outputs.on == '1'
        uses: actions/deploy-pages@v4
