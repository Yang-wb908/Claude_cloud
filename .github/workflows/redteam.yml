name: 레드팀 주간 (악마의 변호인·핵심 가정 점검)

on:
  schedule:
    - cron: "20 1 * * 2"             # 화요일 01:20 UTC = 10:20 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: Claude Code CLI (구독 토큰 모드)
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 같은 step의 env는 if 조건에서 보이지 않으므로 셸에서 판정한다
          if [ -n "$OAUTH" ] && [ -z "$APIKEY" ]; then npm install -g @anthropic-ai/claude-code && claude --version; else echo "구독 토큰 없음(또는 API 키 우선) → CLI 설치 생략"; fi
      - name: 레드팀 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
        run: python dashboard/pipeline/run.py redteam
      - name: 커밋·Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "situation-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/judgments.json dashboard/data/redteam.json reports
          git diff --cached --quiet || (git commit -m "data: 레드팀 $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push)
          if [ -f reports/REDTEAM-latest.md ]; then
            gh label create dissent --color E99695 --force 2>/dev/null || true
            gh issue create --title "[이견] 레드팀 주간 반론 $(date -u +%Y-%m-%d)" --label dissent --label advisor --body-file reports/REDTEAM-latest.md
            cat reports/REDTEAM-latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
