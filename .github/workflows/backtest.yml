name: 주간 백테스트 (시계열·트립와이어·판단 장부)

on:
  schedule:
    - cron: "50 0 * * 1"             # 월요일 00:50 UTC = 09:50 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: 2년 일봉 시계열 수집 → 백테스트
        run: |
          set -euo pipefail
          python dashboard/pipeline/run.py series
          python dashboard/pipeline/run.py backtest
          python dashboard/build.py
      - name: 결과 커밋
        run: |
          git config user.name "situation-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/series.json dashboard/data/backtest.json reports/BACKTEST-latest.md
          git diff --cached --quiet || (git commit -m "data: 주간 백테스트 $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push)
      - name: 백테스트 이슈에 댓글 (고정 스레드)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create backtest --color 5319E7 --description "주간 백테스트 결과 스레드" 2>/dev/null || true
          N=$(gh issue list --label backtest --state open --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            N=$(gh issue create --title "📊 주간 백테스트 결과 스레드" --label backtest --body "매주 월요일 시계열 백테스트 결과가 댓글로 쌓입니다. 사건 연구·트립와이어 발동 이력·판단 장부 보정 점수." | grep -o '[0-9]*$')
          fi
          gh issue comment "$N" --body-file reports/BACKTEST-latest.md
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            dashboard/data/backtest.json
            reports/BACKTEST-latest.md
          retention-days: 90
