name: 일일 SITREP 릴리스

on:
  schedule:
    - cron: "40 0 * * *"            # 00:40 UTC = 09:40 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: Claude Code CLI (구독 토큰 모드)
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 같은 step의 env는 if 조건에서 보이지 않으므로 셸에서 판정한다
          if [ -n "$OAUTH" ] && [ -z "$APIKEY" ]; then npm install -g @anthropic-ai/claude-code && claude --version; else echo "구독 토큰 없음(또는 API 키 우선) → CLI 설치 생략"; fi
      - name: SITREP 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
        run: python dashboard/pipeline/run.py report
      - name: 데이터 스냅숏 묶기
        run: |
          D=$(date -u +%Y-%m-%d)
          echo "DATE=$D" >> "$GITHUB_ENV"
          mkdir -p dist
          cp reports/SITREP-$D.md dist/
          zip -qr dist/snapshot-$D.zip dashboard/data_snapshot.json dashboard/intel.auto.json dashboard/intel.js dashboard/iw.js dashboard/theaters.js dashboard/data
          [ -f dashboard/snapshots/latest.png ] && cp dashboard/snapshots/latest.png dist/board-$D.png || true
          [ -f reports/BACKTEST-latest.md ] && cp reports/BACKTEST-latest.md dist/ || true
          ls products/DIB-*.md products/DIB-*.pdf 2>/dev/null | tail -2 | xargs -r -I{} cp {} dist/
      - name: 보고서 커밋
        run: |
          git config user.name "situation-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "report: SITREP ${DATE} [skip ci]" && git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push)
      - name: Release 발행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sitrep-${DATE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "reports/SITREP-${DATE}.md"
          else
            gh release create "$TAG" dist/* --title "SITREP ${DATE}" --notes-file "reports/SITREP-${DATE}.md"
          fi
