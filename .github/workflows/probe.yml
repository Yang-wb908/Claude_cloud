name: 정형 데이터 점검 (FIRMS·GFW·EIA·FRED·공개 피드 단독 실행, 커밋 없음)

# 키 연결·응답 형식을 빠르게 확인한다. 결과는 실행 요약과 아티팩트로만 남기고 저장소에는 커밋하지 않는다.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "firms, feeds, openfeeds, domains 중 하나만 (비우면 모두)"
        type: string
        default: ""
  push:
    branches: ["claude/**"]
    paths: ["ops/PROBE"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: 실행
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$ONLY" ] || [ "$ONLY" = "feeds" ]; then python dashboard/pipeline/run.py feeds || true; fi
          if [ -z "$ONLY" ] || [ "$ONLY" = "firms" ]; then python dashboard/pipeline/run.py firms || true; fi
          if [ -z "$ONLY" ] || [ "$ONLY" = "openfeeds" ]; then python dashboard/pipeline/run.py openfeeds || true; fi
          if [ -z "$ONLY" ] || [ "$ONLY" = "domains" ]; then python dashboard/pipeline/run.py domains || true; fi
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          for f in ("dashboard/data/feeds.json", "dashboard/data/firms.json"):
              if not os.path.exists(f): print(f"- {f}: 없음"); continue
              d = json.load(open(f))
              if "eia" in d:
                  for k in ("eia", "fred", "gfw"):
                      v = d.get(k) or {}
                      data = v.get("data") or {}
                      print(f"- {k}: ok={v.get('ok')} series={len([x for x in data if not str(x).startswith('_')])} err={str(v.get('err') or '')[:600]}")
                      for e in (data.get("_errors") or [])[:4]: print(f"  - {e[:600]}")
              else:
                  print(f"- firms: alerts={d.get('n_alerts')} learning={d.get('learning')} errors={d.get('errors')[:3]}")
          f = "dashboard/data/openfeeds.json"
          if os.path.exists(f):
              d = json.load(open(f))
              print(f"- openfeeds summary: {d.get('summary')}")
              for k in ("ioda", "poly", "quakes", "gdacs", "ofac"):
                  v = d.get(k) or {}
                  print(f"- {k}: ok={v.get('ok')} err={str(v.get('err') or '')[:500]}")
              io = ((d.get("ioda") or {}).get("data") or {}).get("countries") or []
              for r in io[:15]: print(f"  - IODA {r['code']} {r['name']} score={r['score']} th={r.get('th')} src={r.get('sources')}")
              pm = (d.get("poly") or {}).get("data") or {}
              print(f"  - Polymarket markets={pm.get('n_markets')}")
              for sid, m in (pm.get("matched") or {}).items(): print(f"  - match {sid}: p={m['p']} vol={m['vol']} n={m['n_candidates']} | {m['q'][:140]}")
              for m in (pm.get("top") or [])[:25]: print(f"  - top p={m['p']} vol={m['vol']} | {m['q'][:140]}")
              for q in ((d.get("quakes") or {}).get("data") or [])[:6]: print(f"  - quake {q['d']} M{q['mag']} {q['place']} near={q['near']}")
              for g in ((d.get("gdacs") or {}).get("data") or [])[:8]: print(f"  - gdacs {g['level']} {g['type']} {g['name']} {g['country']} {g['from']}..{g['to']}")
              of = (d.get("ofac") or {}).get("data") or {}
              print(f"  - OFAC total={of.get('n_total')} baseline={of.get('baseline')} new={of.get('n_new')}")
          f = "dashboard/data/domains.json"
          if os.path.exists(f):
              d = json.load(open(f))
              print(f"- domains summary: {d.get('summary')}")
              for k in ("adsb", "kev", "ransom"):
                  v = d.get(k) or {}
                  print(f"- {k}: ok={v.get('ok')} err={str(v.get('err') or '')[:500]}")
              ad = ((d.get("adsb") or {}).get("data") or {})
              print(f"  - ADS-B mil total in AOIs={ad.get('total_mil')}")
              for k, a in (ad.get("areas") or {}).items(): print(f"  - {k}: n={a['n']} key={a['key']} roles={a['by_role']} types={sorted({x['t'] for x in a['ac']})[:12]}")
              kv = ((d.get("kev") or {}).get("data") or {})
              print(f"  - KEV total={kv.get('n_total')} 14d={kv.get('n_recent')} week={kv.get('n_week')}")
              for r in (kv.get("recent") or [])[:6]: print(f"  - KEV {r['added']} {r['cve']} {r['vendor']} {r['product']} edge={r.get('edge')} ransom={r['ransom']}")
              rw = ((d.get("ransom") or {}).get("data") or {})
              print(f"  - ransomware week={rw.get('n_week')} by_country={rw.get('by_country')} kr={[x['victim'] for x in rw.get('kr', [])][:5]}")
          PY
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" || true
          import requests
          for name, url in (("ADSB raw", "https://api.adsb.lol/v2/mil"), ("RW raw", "https://api.ransomware.live/v2/recentvictims")):
              try:
                  r = requests.get(url, timeout=40); print(f"- {name}: HTTP {r.status_code}"); print("```"); print(r.text[:900]); print("```")
              except Exception as e:
                  print(f"- {name}: {e}")
          PY
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" || true
          # 원 응답 형식 확인용 (IODA·GDACS 앞부분)
          import time, requests
          now = int(time.time())
          for name, url, params in (("IODA raw", "https://api.ioda.inetintel.cc.gatech.edu/v2/outages/summary", {"from": now - 86400, "until": now, "entityType": "country"}),
                                    ("GDACS raw", "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH", {"eventlist": "TC;EQ;FL", "alertlevel": "Orange;Red"})):
              try:
                  r = requests.get(url, params=params, timeout=40)
                  print(f"- {name}: HTTP {r.status_code}"); print("```"); print(r.text[:1500]); print("```")
              except Exception as e:
                  print(f"- {name}: {e}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            dashboard/data/feeds.json
            dashboard/data/firms.json
            dashboard/data/openfeeds.json
            dashboard/data/domains.json
          retention-days: 3
