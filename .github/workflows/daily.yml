name: 일일 동기화 (시세·예측 스냅숏·적중 채점)

on:
  schedule:
    - cron: "20 0 * * *"             # 00:20 UTC = 09:20 KST, SITREP(00:40) 전에
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: Claude Code CLI (구독 토큰 모드)
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 같은 step의 env는 if 조건에서 보이지 않으므로 셸에서 판정한다
          if [ -n "$OAUTH" ]; then npm install -g @anthropic-ai/claude-code && claude --version; else echo "구독 토큰 없음 → CLI 설치 생략 (API 키가 있으면 API 사용)"; fi
      - name: 시계열 → 징후 갱신 → 오늘 예측 스냅숏 → 지난 예측 채점 → 백테스트 → 위험도 → 생산물 → 빌드
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          PIPELINE_BRIEF_MODEL: ${{ vars.PIPELINE_BRIEF_MODEL }}
        run: |
          set -euo pipefail
          python dashboard/pipeline/run.py series
          python dashboard/pipeline/run.py feeds || echo "feeds failed (continuing)"
          python dashboard/pipeline/run.py tripwires
          python dashboard/pipeline/run.py bayes
          python dashboard/pipeline/run.py calib
          python dashboard/pipeline/run.py forecast
          python dashboard/pipeline/run.py score
          python dashboard/pipeline/run.py backtest
          python dashboard/pipeline/run.py risk
          python dashboard/pipeline/run.py briefs
          python dashboard/pipeline/run.py products
          python dashboard/build.py
      - name: 커밋
        run: |
          git config user.name "situation-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A dashboard/data products reports dashboard/brief.html
          git diff --cached --quiet || (git commit -m "data: 일일 동기화 $(date -u +%Y-%m-%d) 예측·채점 [skip ci]" && git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push)
      - name: 브리프 PDF
        continue-on-error: true
        run: |
          D=$(ls products/DIB-*.md 2>/dev/null | tail -1); [ -n "$D" ] || exit 0
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          npx --yes playwright@1.48.2 pdf --browser chromium "file://$PWD/dashboard/brief.html" "${D%.md}.pdf"
          git add "${D%.md}.pdf" && (git commit -m "products: DIB PDF [skip ci]" && git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push) || true
      - name: Slack 전파 (SLACK_WEBHOOK_URL 설정 시)
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request, glob
          d = sorted(glob.glob("products/DIB-*.md"))[-1]
          md = open(d).read()
          bluf = re.search(r"## 1\. BLUF\n\n(.*?)\n\n## 2", md, re.S)
          text = f"*{os.path.basename(d)[:-3]} 일일 정보 브리프*\n" + (bluf.group(1) if bluf else md[:1200])[:2500] + f"\n<https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/blob/{os.environ.get('GITHUB_REF_NAME','')}/{d}|전문 보기>"
          req = urllib.request.Request(os.environ["HOOK"], data=json.dumps({"text": text}).encode(), headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=20)
          EOF
      - name: 이메일 전파 (MAIL_SERVER·MAIL_USER·MAIL_PASS·MAIL_TO 설정 시)
        if: ${{ env.MAIL != '' }}
        env:
          MAIL: ${{ secrets.MAIL_TO }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "[상황판] 일일 정보 브리프 ${{ github.run_id }}"
          to: ${{ secrets.MAIL_TO }}
          from: 세계 상황판
          html_body: file://dashboard/brief.html
      - name: 적중 요약을 Job Summary에
        run: cat reports/RISK-latest.md reports/SCORECARD-latest.md >> "$GITHUB_STEP_SUMMARY"
