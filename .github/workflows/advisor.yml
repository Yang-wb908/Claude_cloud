name: 에이전트 분석관 (주간 하우스 뷰 재검토)

on:
  schedule:
    - cron: "10 1 * * 1"             # 월요일 01:10 UTC = 10:10 KST, 백테스트(00:50) 뒤
  workflow_dispatch:
    inputs:
      claude:
        description: "Claude 에이전트 사용 (ANTHROPIC_API_KEY 필요, 끄면 규칙 점검만)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  # 수집 일시 정지(ops/PAUSED)면 건너뛴다. 재개는 pause.yml(resume).
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops
      - id: g
        run: |
          if [ -f ops/PAUSED ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice title=수집 일시 정지::ops/PAUSED 가 있어 건너뜀. 재개: Actions → '수집 정지·재개' → resume"; exit 0; fi
  advise:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r dashboard/pipeline/requirements.txt
      - name: Claude Code CLI (구독 토큰 모드)
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # 같은 step의 env는 if 조건에서 보이지 않으므로 셸에서 판정한다
          if [ -n "$OAUTH" ]; then npm install -g @anthropic-ai/claude-code && claude --version; else echo "구독 토큰 없음 → CLI 설치 생략 (API 키가 있으면 API 사용)"; fi
      - name: 에이전트 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          PIPELINE_NO_CLAUDE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.claude) && '1' || '' }}
        run: python dashboard/pipeline/run.py advise
      - name: 결과 커밋
        run: |
          git config user.name "situation-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/advisor.json reports/ADVISOR-latest.md
          git diff --cached --quiet || (git commit -m "data: 에이전트 분석관 제안 $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" && git push)
      - name: 제안 Issue 생성 (intake 봇이 충격표를 댓글로, 체크박스를 켜면 하우스 뷰 채택)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create advisor --color F9D0C4 --description "에이전트 분석관 제안" 2>/dev/null || true
          gh issue create --title "[시나리오] 에이전트 하우스 뷰 재검토 $(date -u +%Y-%m-%d)" --label scenario --label advisor --body-file reports/ADVISOR-latest.md
      - run: cat reports/ADVISOR-latest.md >> "$GITHUB_STEP_SUMMARY"
