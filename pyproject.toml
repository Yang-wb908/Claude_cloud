[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarship"
version = "0.1.0"
description = "Ship detection in Sentinel-1 SAR imagery with CFAR, from raw GRD to GeoJSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "shapely>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyter", "nbconvert"]

[project.scripts]
sarship = "sarship.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs access to the public Sentinel-1 bucket"]
addopts = "-m 'not network'"
