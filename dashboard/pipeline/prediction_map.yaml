# 시나리오 ↔ Polymarket 질문 매칭. q 는 질문 문장에 대한 정규식(대소문자 무시), 가장 거래량이 큰 진행 중 시장 하나를 고른다.
# invert: true 면 Yes 가격을 1-p 로 뒤집는다(시나리오가 질문의 반대일 때). 매칭된 질문 원문이 화면에 그대로 나오므로
# 엉뚱한 시장이 걸리면 여기 정규식을 고친다.
scenarios:
  hormuz_war: {q: "(\\bUS\\b|U\\.S\\.|United States|Israel).*\\b(strike|attack|war|invade)s?\\b.*\\bIran|Iran.*\\b(war|military conflict)\\b"}
  hormuz_reopen: {q: "Hormuz.*(reopen|open|resume|normal)"}
  hormuz_persist: {q: "Hormuz.*(closed|closure|blockade)"}
  redsea_houthi: {q: "Houthi.*(attack|strike|ship)"}
  blacksea_deal: {q: "(Russia|Ukraine).*(ceasefire|peace deal|truce)"}
  blacksea_escalate: {q: "(Russia|Putin).*(NATO|nuclear).*(attack|strike|use)"}
  taiwan_quarantine: {q: "China.*(blockade|invade|invasion|quarantine).*Taiwan"}
  korea_strategic: {q: "North Korea.*(nuclear test|ICBM|missile)"}
  venezuela_land: {q: "(\\bUS\\b|U\\.S\\.|United States).*(invade|ground|troops|military).*Venezuela"}
  us_mexico_land_strike: {q: "(\\bUS\\b|U\\.S\\.|United States).*(strike|military action|troops).*Mexico"}
  us_recession: {q: "recession.*(2026|2027)|(2026|2027).*recession"}
  fed_hawkish: {q: "Fed.*(hike|raise|increase).*(rate|rates)"}
  brazil_bolsonaro_win: {q: "Fl[aá]vio Bolsonaro.*win|Brazil.*(election|presidential).*Fl[aá]vio"}
  brazil_lula_win: {q: "Lula.*win|Brazil.*(election|presidential).*Lula"}
  dem_house_win: {q: "Democrat.*(win|control|take).*House|House.*(Democrat)"}
  us_canada_auto_tariffs: {q: "tariff.*Canad"}
  ethiopia_war: {q: "(Ethiopia|Eritrea).*(war|invade|conflict)"}
  india_pak_loc_escalation: {q: "(India|Pakistan).*(strike|war|military conflict)"}
  bio_spread: {q: "(plague|pandemic|PHEIC|WHO.*emergency)"}
