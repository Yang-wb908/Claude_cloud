# 트립와이어: 수집 지표가 임계치를 넘으면 GitHub Issue를 열고 상황판 브리프에 표시한다.
# metric 경로는 intel.auto.json 기준. kind: metric(기본) | event_count
tripwires:
  - id: hormuz_transits_low
    title: "호르무즈 일일 통항 10척 미만 (PortWatch)"
    metric: portwatch.hormuz.latest.n_total
    op: "<"
    value: 10
    sev: 5
    th: iran
    why: "봉쇄·공격으로 통항이 사실상 멈춘 상태. 유가·보험료 급등 선행 지표."
  - id: bab_transits_low
    title: "바브엘만데브 일일 통항 20척 미만 (PortWatch)"
    metric: portwatch.bab.latest.n_total
    op: "<"
    value: 20
    sev: 5
    th: yemen
    why: "홍해 재우회 전환 신호."
  - id: brent_110
    title: "브렌트유 110달러 돌파"
    metric: markets.BZ=F
    op: ">"
    value: 110
    sev: 4
    why: "한국 원유 도입가·물가 직결."
  - id: brent_85
    title: "브렌트유 85달러 하회"
    metric: markets.BZ=F
    op: "<"
    value: 85
    sev: 2
    why: "해협 재개방 기대 반영 가능성."
  - id: krw_1400
    title: "원/달러 1,400원 돌파"
    metric: markets.KRW=X
    op: ">"
    value: 1400
    sev: 3
    why: "안전자산 선호·에너지 수입 부담."
  - id: us10y_55
    title: "미 10년물 5.5% 돌파"
    metric: markets.^TNX
    op: ">"
    value: 5.5
    sev: 3
    why: "글로벌 금융여건 급격 긴축."
  - id: pla_air_40
    title: "대만 주변 PLA 항공기 일 40대 이상"
    metric: pla.latest.aircraft
    op: ">="
    value: 40
    sev: 4
    th: taiwan
    why: "대규모 훈련·압박 재개 지표."
  - id: korea_missile
    title: "북한 미사일 발사 (24시간 내 공습·미사일 유형 사건)"
    kind: event_count
    filter: {th: korea, t: S, days: 1}
    op: ">="
    value: 1
    sev: 3
    th: korea
    why: "한반도 긴장 수위."
  - id: maritime_attacks
    title: "해상 피격·피랍 사건 24시간 내 3건 이상"
    kind: event_count
    filter: {t: M, days: 1}
    op: ">="
    value: 3
    sev: 4
    why: "해협 폐쇄·보험료 급등 선행."
  - id: ethiopia_interstate
    title: "에티오피아–에리트레아 국가 간 교전 관련 사건 급증 (24시간 5건 이상)"
    kind: event_count
    filter: {th: ethiopia, days: 1}
    op: ">="
    value: 5
    sev: 4
    th: ethiopia
    why: "국가 간 전쟁 공식화 가능성."
  - id: ttf_100
    title: "유럽 TTF 가스 100유로/MWh 돌파"
    metric: markets.TTF=F
    op: ">"
    value: 100
    sev: 4
    why: "JKM 연동 → 한국 현물 LNG 도입가 급등."
  - id: wheat_800
    title: "시카고 밀 8달러/bu 돌파"
    metric: markets.ZW=F
    op: ">"
    value: 800
    sev: 3
    why: "흑해 공급 차질 반영, 제분·사료 원가."
  - id: copper_6
    title: "구리 6달러/lb 돌파"
    metric: markets.HG=F
    op: ">"
    value: 6
    sev: 3
    why: "공급 차질·재고 고갈 신호."
  - id: gold_4500
    title: "금 4,500달러/oz 돌파"
    metric: markets.GC=F
    op: ">"
    value: 4500
    sev: 3
    why: "안전자산 수요 급증·달러 신뢰 약화."
  - id: vix_30
    title: "VIX 30 돌파"
    metric: markets.^VIX
    op: ">"
    value: 30
    sev: 4
    why: "위험자산 전반 디레버리징."
  - id: dxy_105
    title: "달러인덱스 105 돌파"
    metric: markets.DX-Y.NYB
    op: ">"
    value: 105
    sev: 3
    why: "신흥국·원자재 통화 압박."
  - id: econ_risk_70
    title: "경제 위험 지수 70 돌파"
    metric: risk.index
    op: ">="
    value: 70
    sev: 4
    why: "시나리오 꼬리·시장·공급망 스트레스 복합 상승. 수입물가·포지션 헤지 점검."
  - id: bio_health_events
    title: "보건안보 전역 24시간 보건(H) 사건 3건 이상"
    kind: event_count
    filter: {th: bio, t: H, days: 1}
    op: ">="
    value: 3
    sev: 3
    th: bio
    why: "2차 감염·격리 확대 신호. 질병청 재평가·검역 격상 점검."
  - id: coverage_surge
    title: "미분류 사건 군집 급증 (어느 전역에도 속하지 않는 보도 5건 이상)"
    metric: coverage.max_cluster
    op: ">="
    value: 5
    sev: 3
    why: "새 위기가 전역 밖에서 터지고 있을 가능성. 수집원 탭의 미분류 군집을 보고 새 전역 등록(PIR Issue)을 검토."
  - id: firms_site_alert
    title: "위성 열점 경보 (감시 시설·분쟁 지역에서 평소의 3배 이상, NASA FIRMS)"
    metric: firms.n_alerts
    op: ">="
    value: 1
    sev: 3
    why: "정유·터미널·기지 주변 열점 급증은 피격·화재 신호. 사건 목록의 '위성 열점' 항목과 FIRMS 지도로 확인."
  - id: fred_stress
    title: "금융 스트레스 지수 1 이상 (세인트루이스 연준 STLFSI4)"
    metric: feeds.fred.data.STLFSI4.v
    op: ">="
    value: 1.0
    sev: 3
    why: "0이 평균, 1 이상은 시장 스트레스가 평소보다 1표준편차 이상 높은 상태."
  - id: hy_spread_5
    title: "미 하이일드 스프레드 5%p 이상 (FRED)"
    metric: feeds.fred.data.BAMLH0A0HYM2.v
    op: ">="
    value: 5.0
    sev: 3
    why: "신용 경색 선행 지표. 위험회피로 원자재·신흥국 자산 동반 하락 가능."
  - id: eia_crude_draw
    title: "미 상업 원유 재고 주간 500만 배럴 이상 감소 (EIA)"
    metric: feeds.eia.data.WCESTUS1.chg_w
    op: "<="
    value: -5000
    sev: 2
    why: "공급 부족 신호. 유가 상방 압력."

  - id: ioda_outage
    title: "감시 국가 인터넷 대규모 장애·차단 (IODA)"
    metric: openfeeds.summary.ioda_alerts
    op: ">="
    value: 1
    sev: 3
    why: "정부의 인터넷 차단은 시위 진압·쿠데타·군사작전 직전에 자주 나온다. 전력망·해저케이블 피격일 수도 있다. 사건 목록의 '인터넷 대규모 장애' 항목과 IODA 그래프로 확인."
  - id: ofac_vessels
    title: "OFAC 신규 제재에 선박 포함 (그림자 선단 단속)"
    metric: openfeeds.summary.ofac_new_vessels
    op: ">="
    value: 1
    sev: 2
    why: "유조선 지정은 이란·러시아·베네수엘라 원유 수출 단속 강화 신호. 운임·보험료와 해당 항로 통항량 변화를 같이 본다."
  - id: quake_near_site
    title: "감시 시설·해협 300km 안 규모 5 이상 지진 (USGS)"
    metric: openfeeds.summary.quakes_near
    op: ">="
    value: 1
    sev: 2
    why: "원전·정유·해협 인근 지진은 공급 차질과 시설 안전 문제로 이어질 수 있다. 핵실험 위장 여부(북한·이란)도 함께 확인."
  - id: gdacs_red
    title: "GDACS 적색 재난 경보 (태풍·홍수·지진·화산)"
    metric: openfeeds.summary.gdacs_red
    op: ">="
    value: 1
    sev: 2
    why: "대규모 인명 피해가 예상되는 재난. 항만·생산 차질과 인도적 위기, 군 동원으로 이어진다."
  - id: mil_air_surge
    title: "분쟁 해역 상공 정찰·급유기 급증 (공개 ADS-B)"
    metric: domains.summary.adsb_surge
    op: ">="
    value: 1
    sev: 3
    why: "정찰기·공중급유기가 평소의 2배 이상이면 작전 준비나 감시 강화 신호. 송출을 끈 기체가 많아 실제는 더 많을 수 있다."
  - id: kev_edge
    title: "VPN·방화벽 등 경계 장비 취약점 실제 악용 확인 (CISA KEV, 3일 내)"
    metric: domains.summary.kev_edge_3d
    op: ">="
    value: 1
    sev: 2
    why: "국가 배후 해킹 조직이 즉시 노리는 유형. 국내 기관·기업 장비 패치 여부 점검."
  - id: ransom_kr
    title: "한국 기업·기관 랜섬웨어 피해 게시 주 3건 이상"
    metric: domains.summary.ransom_kr_week
    op: ">="
    value: 3
    sev: 2
    why: "범죄 집단 유출 사이트 기준(피해 사실 미확인). 특정 업종에 몰리면 표적 공격 캠페인 가능성."
