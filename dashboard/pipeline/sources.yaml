  # ── 구조화 API (A2~B2) ────────────────────────────────────────────
  - {id: gdelt_conflict, name: GDELT DOC 2.0, kind: gdelt, grade: B3, lang: en, region: global,
     queries: ["(Hormuz OR tanker attack) sourcelang:eng", "(Houthi OR \"Red Sea\" OR \"Bab el-Mandeb\") sourcelang:eng", "(Tigray OR Eritrea OR Mekelle) sourcelang:eng", "(Sudan AND (RSF OR Kordofan OR Darfur)) sourcelang:eng", "(\"North Korea\" AND (missile OR DMZ)) sourcelang:eng", "(Taiwan AND (PLA OR ADIZ OR \"coast guard\")) sourcelang:eng", "(Ukraine AND (drone OR strike OR offensive)) sourcelang:eng", "(Sahel OR Mali OR Niger) AND (attack OR JNIM OR \"Islamic State\") sourcelang:eng", "(Somalia AND (pirates OR al-Shabaab)) sourcelang:eng", "(Haiti OR Venezuela) AND (gang OR strike OR military) sourcelang:eng"],
     note: "전 세계 뉴스 메타데이터. 기사 URL을 그대로 받아 도메인 기준으로 재등급."}
  - {id: reliefweb, name: ReliefWeb API, kind: reliefweb, grade: A2, lang: en, region: global, tags: [humanitarian],
