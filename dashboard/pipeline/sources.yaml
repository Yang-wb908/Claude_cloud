  - {id: markets, name: 시장 시세 (Yahoo Finance), kind: markets, grade: B2, lang: en, region: markets, tags: [markets],
     tickers: {"BZ=F": "브렌트유 ($/bbl)", "CL=F": "WTI ($/bbl)", "NG=F": "헨리허브 가스 ($/MMBtu)", "GC=F": "금 ($/oz)", "DX-Y.NYB": "달러인덱스", "KRW=X": "원/달러", "JPY=X": "엔/달러", "^KS11": "코스피", "^GSPC": "S&P 500", "^N225": "니케이225", "^TNX": "미 10년물 (%)", "ZW=F": "시카고 밀 (c/bu)", "BTC-USD": "비트코인 ($)"}}
