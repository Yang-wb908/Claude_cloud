# 수집원 레지스트리. 등급은 Admiralty 코드 기본값(신뢰성 A~F, 신빙성 1~6).
# kind: rss | gnews(Google News 검색 RSS) | gdelt | reliefweb | portwatch | markets | wiki | html
# verify: true 는 URL을 실제 운용에서 아직 검증하지 못한 수집원. 첫 실행 상태표에서 실패하면 교정한다.
defaults:
  timeout: 25
  max_items: 40
  user_agent: "situation-board-collector/0.3 (+https://github.com/Yang-wb908/Claude_cloud)"

sources:
