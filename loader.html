<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계 상황판</title>
<style>
:root{--bg:#f4f6f8;--fg:#1d2733;--mute:#5d6b7a;--line:#d5dce3;--acc:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--fg:#d6dee8;--mute:#8a98a8;--line:#253041;--acc:#58a6ff}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.box{max-width:440px;border:1px solid var(--line);border-radius:10px;padding:20px 22px}
b{font-size:17px}
p{margin:8px 0 0;color:var(--mute)}
button{margin-top:12px;font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.bar{height:3px;margin-top:14px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--acc);animation:go 1.1s ease-in-out infinite}
@keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div class="box">
  <b>세계 상황판</b>
  <p id="s">최신 판을 불러오는 중…</p>
  <div class="bar" id="bar"><i></i></div>
</div>
<script>
/* 세계 상황판 로더 — 이 작은 파일을 열 때마다 배포본(board-dist 브랜치)의 최신 상황판을 받아 그대로 띄운다.
   인터넷이 없으면 마지막으로 받은 판(이 브라우저에 저장)을 띄운다. 키·개인정보는 담지 않는다. */
(async function () {
  "use strict";
  var DIST = "https://raw.githubusercontent.com/Yang-wb908/Claude_cloud/board-dist/";
  var s = document.getElementById("s"), bar = document.getElementById("bar");
  function idb() {
    return new Promise(function (ok, no) {
      try { var r = indexedDB.open("sitboard", 1); r.onupgradeneeded = function () { r.result.createObjectStore("page"); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { no(r.error); }; }
      catch (e) { no(e); }
    });
  }
  async function cacheGet() {
    try { var db = await idb(); return await new Promise(function (ok) { var q = db.transaction("page").objectStore("page").get("latest"); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ok(null); }; }); }
    catch (e) { return null; }
  }
  async function cachePut(v) {
    try { var db = await idb(); await new Promise(function (ok) { var t = db.transaction("page", "readwrite"); t.objectStore("page").put(v, "latest"); t.oncomplete = ok; t.onerror = ok; t.onabort = ok; }); }
    catch (e) {}
  }
  function show(html, meta) {
    // 상황판이 '로더 안에서 실행 중'임을 알도록 표지를 심는다(새 판 감지 시 새로고침 = 최신 판 다시 받기).
    var tag = "<script>window.SIT_LOADER=" + JSON.stringify(meta).replace(/</g, "\\u003c") + ";<\/script>";
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + tag; }) : tag + html;
    document.open(); document.write(html); document.close();
  }
  var html = null, err = "";
  try {
    var c = new AbortController(), tm = setTimeout(function () { c.abort(); }, 45000);
    var r = await fetch(DIST + "index.html?t=" + Date.now(), { cache: "no-store", signal: c.signal });
    clearTimeout(tm);
    if (!r.ok) throw new Error("HTTP " + r.status);
    html = await r.text();
    if (html.length < 100000 || html.indexOf("BUILD") < 0) throw new Error("배포본이 비정상");
  } catch (e) { html = null; err = e && e.name === "AbortError" ? "응답 시간 초과" : (e && e.message) || "연결 실패"; }
  if (html) {
    await cachePut({ html: html, at: new Date().toISOString() });
    show(html, { dist: DIST, online: true });
    return;
  }
  var old = await cacheGet();
  if (old && old.html) { show(old.html, { dist: DIST, online: false, cachedAt: old.at, err: err }); return; }
  bar.hidden = true;
  s.textContent = "최신 판을 받지 못했습니다 (" + err + "). 인터넷 연결을 확인한 뒤 다시 여세요.";
  var b = document.createElement("button"); b.textContent = "다시 시도"; b.onclick = function () { location.reload(); }; s.after(b);
})();
</script>
</body>
</html>
